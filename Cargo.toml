[package]
name = "pachinko_vlt_launcher"
version = "0.2.10"
edition = "2021"
authors = ["Pachinko Team"]
description = "Launcher VLT para registro e autenticação de máquinas"
license = "PROPRIETARY"

[dependencies]
# HTTP Client
reqwest = { version = "0.11", features = ["json", "stream"] }
tokio = { version = "1.0", features = ["full"] }
futures-util = "0.3"

# Serialização JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# CLI
clap = { version = "4.0", features = ["derive"] }

# Setup interativo
dialoguer = "0.11"

# Configuração e Paths
dirs = "5.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Data/Hora
chrono = { version = "0.4", features = ["serde"] }

# Hostname
hostname = "0.4"

# Hardware fingerprint
sha2 = "0.10"

# Download + extração do jogo (tar.gz em memória, direto pro tmpfs)
tar = "0.4"
flate2 = "1.0"

# TUI
ratatui = "0.28"
crossterm = "0.28"

# Áudio (listar saídas + tocar tom de teste)
cpal = "0.15"

# Linux-specific
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
mockito = "1.0"
tokio-test = "0.4"

[[bin]]
name = "pachinko_vlt_launcher"
path = "src/main.rs"
